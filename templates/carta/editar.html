<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar plato</title>
</head>
<body>
    <!-- Cumplimos el requisito de mostrar el nombre del plato que se está editando -->
    <h1>Editar plato: {{ plato.nombre }}</h1>
    
    <!-- Formulario para enviar los datos por el método POST -->
    <form method="post">
        {% csrf_token %}
        
        <!-- Renderizamos el formulario que enviamos desde views.py -->
        {{ form.as_p }}
        
        <!-- Cumplimos el requisito del botón específico -->
        <button type="submit">Guardar cambios</button>
    </form>
    
    <br>
    <!-- Cumplimos el requisito del enlace para volver -->
    <a href="{% url 'carta:lista' %}">Volver al listado</a>

</body>
</html>
