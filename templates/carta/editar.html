{% extends 'base.html' %}

{% block titulo %}Editar plato | El Buen Sabor{% endblock %}

{% block contenido %}
<!-- Usamos clases de Bootstrap (card, mt-4, bg-dark, etc.) para darle el aspecto moderno -->
<div class="card mt-4">
    <div class="card-header bg-dark text-white">
        <h4 class="mb-0">Editar plato: {{ plato.nombre }}</h4>
    </div>
    <div class="card-body">
        <!-- novalidate: las validaciones las hace Django y muestra sus mensajes junto a cada campo -->
        <form method="post" novalidate>
            {% csrf_token %}

            <!-- Mismos campos y mensajes de error que la pantalla de alta -->
            {% include 'carta/_campos_plato.html' with formulario=form %}

            <div class="mt-4">
                <!-- Botones estilizados -->
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <a href="{% url 'carta:lista' %}" class="btn btn-secondary ms-2">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
