{% extends 'base.html' %}

{% block titulo %}Eliminar plato | El Buen Sabor{% endblock %}

{% block contenido %}
<!-- Usa el mismo encabezado oscuro y quitamos el borde rojo de la tarjeta -->
<div class="card mt-4 shadow-sm">
    <div class="card-header bg-dark text-white">
        <h4 class="mb-0">Confirmar eliminación</h4>
    </div>
    <div class="card-body text-center mt-3 mb-3">
        <p class="lead text-muted">¿Estás seguro de que deseas eliminar el siguiente plato de forma permanente?</p>
        
        <!-- El nombre del plato ahora es oscuro y destacado, no rojo -->
        <h2 class="mb-4 text-dark fw-bold">{{ plato.nombre }}</h2>
        
        <form method="post">
            {% csrf_token %}
            <!-- Solo el botón mantiene el color rojo (danger) -->
            <button type="submit" class="btn btn-danger px-4">Sí, eliminar</button>
            <a href="{% url 'carta:lista' %}" class="btn btn-secondary px-4 ms-2">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
