<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar plato</title>
</head>
<body>
    <h1>Confirmar eliminación</h1>
    <p>¿Estás seguro de que deseas eliminar el siguiente plato de forma permanente?</p>
    
    <!-- Cumplimos el requisito de mostrar los datos del plato -->
    <ul>
        <li><strong>Plato:</strong> {{ plato.nombre }}</li>
        <!-- Si tu modelo tiene precio u otros campos, podrías agregarlos aquí -->
    </ul>
    
    <!-- Formulario POST para la eliminación segura -->
    <form method="post">
        <!-- El token de seguridad que conversamos antes -->
        {% csrf_token %}
        
        <!-- Cumplimos el requisito del botón rojo "Sí, eliminar" -->
        <button type="submit" style="background-color: red; color: white; padding: 5px 10px; cursor: pointer;">
            Sí, eliminar
        </button>
        
        <!-- Cumplimos el requisito de "Cancelar" que vuelva al listado -->
        <a href="{% url 'carta:lista' %}" style="margin-left: 10px;">Cancelar</a>
    </form>
</body>
</html>
