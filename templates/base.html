{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}El Buen Sabor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --marron: #5a3921;
            --crema: #fdf6ec;
            --tomate: #c0392b;
        }
        body {
            background-color: var(--crema);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .navbar-restaurante {
            background-color: var(--marron);
        }
        .navbar-restaurante .navbar-brand,
        .navbar-restaurante .nav-link {
            color: var(--crema);
        }
        .navbar-restaurante .nav-link:hover,
        .navbar-restaurante .nav-link.activo {
            color: #f0c987;
        }
        footer {
            background-color: var(--marron);
            color: var(--crema);
        }
        .precio {
            color: var(--tomate);
            font-weight: 600;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-restaurante shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'carta:inicio' %}">🍔 El Buen Sabor</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link {% block nav_inicio %}{% endblock %}" href="{% url 'carta:inicio' %}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% block nav_lista %}{% endblock %}" href="{% url 'carta:lista' %}">Ver la carta</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4 flex-grow-1">
    {% if messages %}
        {% for mensaje in messages %}
            <div class="alert alert-{{ mensaje.tags }} alert-dismissible fade show" role="alert">
                {{ mensaje }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block contenido %}{% endblock %}
</main>

<footer class="py-3 mt-auto">
    <div class="container text-center small">
        &copy; 2026 Restaurante El Buen Sabor &middot; Todos los derechos reservados
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
